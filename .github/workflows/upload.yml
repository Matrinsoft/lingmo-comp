name: Upload to OBS
permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]

jobs:
  debian:
    name: Debian Testing
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y sudo git ca-certificates curl
          apt-get install -y equivs git devscripts debhelper lintian build-essential automake autotools-dev cmake g++ just
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod +x debian/rules

      - name: Vendor dependencies
        run: |
          mkdir -p .cargo
          cargo vendor --locked 2>/dev/null | awk '/^\[/{p=1} p' > .cargo/config
          if ! grep -q 'vendored-sources' .cargo/config 2>/dev/null; then
            echo '[source.crates-io]' >> .cargo/config
            echo 'replace-with = "vendored-sources"' >> .cargo/config
            echo '' >> .cargo/config
            echo '[source.vendored-sources]' >> .cargo/config
            echo 'directory = "vendor"' >> .cargo/config
          fi
          grep '^source = "git+" Cargo.lock | sed 's/source = "//;s/"$//' | sort -u | while read src; do
            echo "[source \"$src\"]"
            echo 'replace-with = "vendored-sources"'
            echo ""
          done >> .cargo/config
          tar pcf vendor.tar vendor .cargo/config
          rm -rf vendor

      - name: Build source package
        run: |
          CLEAN=0 VENDOR=0 dpkg-buildpackage -S -us -uc -d
      
      - name: Collect files
        run: |
          mkdir -p src-tar-output
          mv ../*.dsc ../*.tar.* src-tar-output/

      - name: Upload
        uses: LingmoOS/action-upload-to-obs@0.0.4
        with:
          remove-old-sources: true
          obs-package-name: 'lingmo-comp'
          obs-project-name: 'home:LingmoOS:Lithium'
          obs-user-name: ${{ secrets.OBS_USERNAME }}
          obs-password: ${{ secrets.OBS_TOKEN }}
          obs-instance-url: 'https://api.opensuse.org'
          local-package-dir: './src-tar-output'
