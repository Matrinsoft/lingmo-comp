name: Build and Release

permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y sudo git ca-certificates curl
          apt-get install -y equivs git devscripts debhelper lintian build-essential automake autotools-dev cmake g++ just
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod +x debian/rules

      - name: Vendor dependencies
        run: |
          cargo vendor
          mkdir -p .cargo
          cargo vendor --sync Cargo.toml 2>/dev/null | awk '/^\[/{p=1} p' > .cargo/config
          echo 'directory = "vendor"' >> .cargo/config

      - name: Build binary packages
        run: dpkg-buildpackage -b -us -uc

      - name: Collect .deb files
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build+$(date -u +%y%m%d+%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.deb \
            --title "$TAG" \
            --generate-notes
