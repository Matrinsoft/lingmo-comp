name: Build and Release

permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y sudo git ca-certificates curl
          curl -sLO http://ftp.debian.org/debian/pool/main/g/gh/gh_2.46.0-4_amd64.deb
          apt install -y ./gh_2.46.0-4_amd64.deb
          apt-get install -y equivs git devscripts debhelper lintian build-essential automake autotools-dev cmake g++ just
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: apt build-dep -y ./

      - name: Fix permissions
        run: chmod +x debian/rules

      - name: Build binary packages
        run: |
          sed -i 's/build-vendored/build-release/g' debian/rules
          CLEAN=0 VENDOR=0 dpkg-buildpackage -b -us -uc

      - name: Collect .deb files
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="build+$(date -u +%y%m%d+%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.deb \
            --title "$TAG" \
            --generate-notes